[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cantfail"
version = "0.1.0"
description = "The tautology detector for Python test suites"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools]
packages = ["cantfail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
